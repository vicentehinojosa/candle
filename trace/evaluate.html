<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Trace — Evaluate Your Process</title>
<meta name="description" content="The Trace evaluates human intellectual agency in AI-assisted work using the Process-Centered Accountability framework. Not detection. A reading of your process.">
<meta property="og:title" content="The Trace — A reading of your process">
<meta property="og:description" content="Detection asks whether AI wrote it. The Trace asks whether you were intellectually present. Institute for Process-Centered Accountability.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://candle.codes/trace">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F5F1EC'/%3E%3Ctext x='50' y='68' font-size='62' text-anchor='middle' fill='%237D4E3A' font-family='Georgia,serif'%3E%E2%97%88%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:           #F5F1EC;
  --bg-subtle:    #EDE9E2;
  --ink:          #1C1917;
  --mid:          #5C5248;
  --light:        #9C8E82;
  --border:       #DAD4CC;
  --border-focus: #B5ACA3;
  --accent:       #7D4E3A;
  --accent-hover: #6A4030;
  --high:         #3A6B4A;
  --medium:       #7A6230;
  --low:          #8B3A3A;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  line-height: 1.65;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

body::after {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.025'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 1000;
}

/* ── NAV ── */
nav {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 48px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--bg);
  position: relative; z-index: 10;
}

.nav-brand {
  font-family: 'Lora', serif;
  font-size: 0.82rem; letter-spacing: 0.1em;
  color: var(--ink); text-decoration: none;
  font-weight: 500;
}

.nav-links { display: flex; gap: 1.8rem; }

.nav-links a {
  font-size: 0.7rem; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--light);
  text-decoration: none; transition: color 0.2s;
}
.nav-links a:hover { color: var(--ink); }

/* ── APP BODY ── */
.app-body {
  flex: 1; display: flex; flex-direction: column;
  overflow: hidden; position: relative;
}

/* ── BRAND SPACE ── */
.brand-space {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 2rem; text-align: center;
  transition: opacity 0.35s ease, max-height 0.45s ease, padding 0.4s ease;
  max-height: 9999px; overflow: hidden;
}

.brand-space.hidden {
  opacity: 0; max-height: 0; padding: 0;
  pointer-events: none;
}

.brand-eyebrow {
  font-size: 0.6rem; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--light);
  margin-bottom: 1.5rem; font-weight: 400;
}

.brand-title {
  font-family: 'Lora', serif;
  font-size: clamp(2.5rem, 6vw, 4.5rem);
  font-weight: 500; color: var(--ink);
  letter-spacing: -0.01em; margin-bottom: 0.9rem;
  line-height: 1.1;
}

.brand-sub {
  font-family: 'Lora', serif;
  font-style: italic; font-size: 1rem;
  color: var(--mid); max-width: 36ch;
}

/* ── LOADING ── */
.loading-space {
  flex: 1; display: none; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 1.2rem;
}
.loading-space.active { display: flex; }

@keyframes breathe {
  0%, 100% { opacity: 0.25; transform: scale(1); }
  50%       { opacity: 0.7;  transform: scale(1.1); }
}

.loading-mark {
  font-family: 'Lora', serif; font-size: 1.8rem;
  color: var(--accent);
  animation: breathe 3s ease-in-out infinite;
}

.loading-label {
  font-size: 0.6rem; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--light);
}

/* ── RESULTS SPACE ── */
.results-space {
  flex: 0; overflow-y: auto; opacity: 0;
  transition: opacity 0.5s ease 0.15s, flex 0.4s ease;
}
.results-space.active { flex: 1; opacity: 1; }

.results-inner {
  max-width: 600px; margin: 0 auto;
  padding: 3rem 1.5rem 2rem;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.results-eyebrow {
  font-size: 0.58rem; letter-spacing: 0.35em;
  text-transform: uppercase; color: var(--light);
  text-align: center; margin-bottom: 3rem;
  animation: fadeUp 0.6s ease forwards;
}

/* Score */
.score-block {
  text-align: center; margin-bottom: 2.5rem;
  animation: fadeUp 0.6s ease 0.1s both;
}

.score-number {
  font-family: 'Lora', serif;
  font-size: clamp(4.5rem, 14vw, 8rem);
  font-weight: 500; line-height: 1;
  color: var(--ink); margin-bottom: 1rem;
  letter-spacing: -0.02em;
}
.score-number.high   { color: var(--high); }
.score-number.medium { color: var(--medium); }
.score-number.low    { color: var(--low); }

.score-bar-track {
  width: 100%; height: 1px;
  background: var(--border);
  margin: 0 auto 0.8rem; max-width: 280px;
  position: relative;
}

.score-bar-fill {
  height: 100%; position: absolute; top: 0; left: 0;
  transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
  width: 0;
}
.score-bar-fill.high   { background: var(--high); }
.score-bar-fill.medium { background: var(--medium); }
.score-bar-fill.low    { background: var(--low); }

.score-tier {
  font-size: 0.62rem; letter-spacing: 0.28em;
  text-transform: uppercase; color: var(--mid);
}
.score-tier.high   { color: var(--high); }
.score-tier.medium { color: var(--medium); }
.score-tier.low    { color: var(--low); }

/* Sections */
.result-section {
  margin-bottom: 2rem;
  animation: fadeUp 0.6s ease 0.25s both;
}

.section-label {
  display: block; font-size: 0.58rem;
  letter-spacing: 0.28em; text-transform: uppercase;
  color: var(--light); margin-bottom: 0.8rem;
}

.section-rule {
  border: none; border-top: 1px solid var(--border);
  margin: 2rem 0;
}

.rationale-text {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 1rem; line-height: 1.85; color: var(--mid);
}

/* Trace moments */
.trace-moment {
  padding: 1rem 0;
  border-bottom: 1px solid var(--bg-subtle);
}
.trace-moment:first-child { border-top: 1px solid var(--bg-subtle); }

.trace-moment-label {
  font-size: 0.58rem; letter-spacing: 0.2em;
  text-transform: uppercase; color: var(--accent);
  margin-bottom: 0.35rem;
}

.trace-moment-text {
  font-size: 0.9rem; color: var(--mid); line-height: 1.7;
}

/* Framework note */
.framework-note {
  padding: 1.2rem 1.4rem;
  border-left: 2px solid var(--border-focus);
  background: var(--bg-subtle);
  margin-top: 2rem;
}

.framework-note-text {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 0.9rem; color: var(--mid); line-height: 1.75;
}

.btn-reset {
  display: inline-block; margin-top: 2rem;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--mid); padding: 0.6rem 1.6rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.68rem; letter-spacing: 0.18em;
  text-transform: uppercase; cursor: pointer;
  transition: all 0.2s; border-radius: 1px;
}
.btn-reset:hover { border-color: var(--ink); color: var(--ink); }

/* ── PAYWALL ── */
.paywall-card {
  margin-top: 2.5rem;
  border-top: 1px solid var(--border);
  padding-top: 2rem;
}

.paywall-card--standalone {
  display: flex; align-items: center;
  justify-content: center;
  min-height: 60vh; border-top: none;
  padding-top: 0; margin-top: 0;
}

.paywall-inner {
  text-align: center; max-width: 38ch;
}

.paywall-eyebrow {
  font-size: 0.6rem; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--light);
  margin-bottom: 1rem;
}

.paywall-title {
  font-family: 'Lora', serif;
  font-size: 1.8rem; font-weight: 500;
  color: var(--ink); line-height: 1.2;
  margin-bottom: 0.8rem;
}

.paywall-body {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 1rem; color: var(--mid);
  margin-bottom: 1.8rem; line-height: 1.7;
}

.btn-subscribe {
  display: block;
  background: var(--accent); color: var(--bg);
  border: none; padding: 0.85rem 2.2rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.72rem; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; text-decoration: none;
  border-radius: 1px; margin-bottom: 1.2rem;
  transition: background 0.2s, transform 0.15s;
}
.btn-subscribe:hover {
  background: var(--accent-hover); transform: translateY(-1px);
}

.paywall-note {
  font-size: 0.75rem; color: var(--light);
}

.paywall-link {
  color: var(--accent); text-decoration: none;
}
.paywall-link:hover { text-decoration: underline; }

/* ── INPUT DOCK ── */
.input-dock {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  padding: 1.4rem 2rem 1.8rem;
  background: var(--bg);
  position: relative; z-index: 5;
  transition: opacity 0.3s ease, max-height 0.4s ease, padding 0.4s ease;
  max-height: 9999px; overflow: hidden;
}
.input-dock.hidden {
  opacity: 0; max-height: 0;
  padding: 0; pointer-events: none;
}

.input-dock-inner {
  max-width: 600px; margin: 0 auto;
}

.dock-label {
  display: block; font-size: 0.58rem;
  letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--light); margin-bottom: 0.6rem;
}

textarea {
  width: 100%; background: transparent;
  border: 1px solid var(--border); border-radius: 1px;
  color: var(--ink); font-family: 'DM Sans', sans-serif;
  font-size: 0.88rem; padding: 0.85rem 1rem;
  min-height: 90px; max-height: 180px;
  resize: vertical; outline: none; line-height: 1.6;
  transition: border-color 0.2s;
}
textarea:focus { border-color: var(--border-focus); }
textarea::placeholder { color: var(--light); font-style: italic; }

.context-row {
  display: flex; gap: 0.5rem; margin-top: 0.5rem;
}

.context-input {
  flex: 1; background: transparent;
  border: 1px solid var(--border); border-radius: 1px;
  color: var(--mid); font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem; padding: 0.5rem 0.75rem;
  outline: none; transition: border-color 0.2s;
}
.context-input:focus { border-color: var(--border-focus); }
.context-input::placeholder { color: var(--light); }

.dock-footer {
  display: flex; align-items: center;
  justify-content: space-between; margin-top: 0.75rem;
  gap: 1rem;
}

.dock-hint {
  font-size: 0.68rem; color: var(--light);
  font-style: italic; flex: 1;
}

.btn-evaluate {
  flex-shrink: 0;
  background: var(--accent); color: var(--bg);
  border: none; padding: 0.65rem 2rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.68rem; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
  cursor: pointer; border-radius: 1px;
  transition: background 0.2s, transform 0.15s;
}
.btn-evaluate:hover:not(:disabled) {
  background: var(--accent-hover); transform: translateY(-1px);
}
.btn-evaluate:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

.notice {
  max-width: 600px; margin: 0 auto 1.5rem;
  padding: 0.7rem 1rem;
  border: 1px solid var(--border);
  background: var(--bg-subtle);
  font-size: 0.78rem; color: var(--mid);
  text-align: center; border-radius: 1px;
}

.error-space {
  flex: 1; display: none; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 0.9rem; padding: 2rem; text-align: center;
}
.error-space.active { display: flex; }

.error-title {
  font-family: 'Lora', serif; font-size: 1.4rem;
  font-weight: 500; color: var(--ink);
}

.error-body {
  font-family: 'Lora', serif; font-style: italic;
  font-size: 0.95rem; color: var(--mid); max-width: 40ch;
}
</style>
</head>
<body>

<nav>
  <a class="nav-brand" href="/trace">The Trace</a>
  <div class="nav-links">
    <a href="/trace">About</a>
    <a href="https://candle.codes">candle.codes</a>
  </div>
</nav>

<div class="app-body">

  <div class="brand-space" id="brand-space">
    <p class="brand-eyebrow">Institute for Process-Centered Accountability</p>
    <h1 class="brand-title">The Trace</h1>
    <p class="brand-sub">A reading of your process.</p>
  </div>

  <div class="loading-space" id="loading-space" role="status" aria-live="polite">
    <div class="loading-mark">◈</div>
    <p class="loading-label">Reading</p>
  </div>

  <div class="error-space" id="error-space">
    <p class="error-title" id="error-title">Something went wrong.</p>
    <p class="error-body" id="error-body">Please try again.</p>
    <button class="btn-reset" onclick="resetEval()">Back</button>
  </div>

  <div class="results-space" id="results-space" role="region" aria-live="polite" aria-label="Evaluation result">
    <div class="results-inner" id="results-inner"></div>
  </div>

  <div class="input-dock">
    <div class="input-dock-inner">
      <label class="dock-label" for="paste-input">Conversation</label>
      <textarea id="paste-input" placeholder="Paste your conversation here. In Claude or ChatGPT: select all, copy, paste."></textarea>
      <div class="context-row">
        <input class="context-input" id="ctx-subject" placeholder="Discipline (optional)" />
        <input class="context-input" id="ctx-type" placeholder="Work type (optional)" />
        <input class="context-input" id="ctx-stage" placeholder="Stage (optional)" />
      </div>
      <div class="dock-footer">
        <span class="dock-hint">Paste any conversation log. The framework reads what the exchange actually shows.</span>
        <button class="btn-evaluate" id="btn-evaluate" onclick="runEvaluation()">Evaluate</button>
      </div>
    </div>
  </div>

</div>

<script>
/* The evaluation framework lives on the server at /api/trace. */

function esc(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function getCookie(name) {
  const match = document.cookie.match(new RegExp('(^| )' + name + '=([^;]+)'));
  return match ? match[2] : null;
}

function setCookie(name, value, days) {
  const exp = new Date(Date.now() + days * 864e5).toUTCString();
  document.cookie = name + '=' + value + '; expires=' + exp + '; path=/; SameSite=Lax';
}

/* Set FREE_LIMIT_ON to true when the subscription backend is ready. */
const FREE_LIMIT_ON = false;

function isSubscriber() { return !!getCookie('trace_session'); }
function hasFreeUsed()  { return getCookie('trace_used') === 'true'; }
function markFreeUsed() { setCookie('trace_used', 'true', 30); }

const ERRORS = {
  rate_limit: ['You have reached the limit for now.', 'The Trace allows a limited number of evaluations per hour. Please try again later.'],
  too_short:  ['That log is too short to read.', 'Paste a full conversation. The framework needs enough exchange to evaluate.'],
  forbidden:  ['This request was blocked.', 'Please open The Trace directly at candle.codes/trace.'],
  upstream:   ['The reading could not be completed.', 'The evaluator did not respond. Please try again in a moment.'],
  unreadable: ['The reading came back malformed.', 'This occasionally happens with unusual logs. Please try again.'],
  network:    ['Connection failed.', 'Check your connection and try again.'],
  paywall:    ['Free evaluation used.', 'Continue with The Trace to keep reading your process.']
};

function showError(code) {
  const [title, body] = ERRORS[code] || ERRORS.upstream;
  document.getElementById('error-title').textContent = title;
  document.getElementById('error-body').textContent = body;
  document.getElementById('loading-space').classList.remove('active');
  document.getElementById('results-space').classList.remove('active');
  document.getElementById('brand-space').classList.add('hidden');
  document.querySelector('.input-dock').classList.add('hidden');
  document.getElementById('error-space').classList.add('active');
  document.getElementById('btn-evaluate').disabled = false;
}

async function runEvaluation() {
  const content = document.getElementById('paste-input').value.trim();

  if (!content || content.length < 100) {
    alert('Please paste a conversation to evaluate.');
    return;
  }

  if (FREE_LIMIT_ON && !isSubscriber() && hasFreeUsed()) {
    showPaywall();
    return;
  }

  document.getElementById('brand-space').classList.add('hidden');
  document.getElementById('results-space').classList.remove('active');
  document.getElementById('error-space').classList.remove('active');
  document.getElementById('loading-space').classList.add('active');
  document.getElementById('btn-evaluate').disabled = true;
  document.querySelector('.input-dock').classList.add('hidden');

  try {
    const res = await fetch('/api/trace', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        log: content,
        subject: document.getElementById('ctx-subject').value.trim(),
        type:    document.getElementById('ctx-type').value.trim(),
        stage:   document.getElementById('ctx-stage').value.trim()
      })
    });

    let data = null;
    try { data = await res.json(); } catch (e) { data = null; }

    if (!res.ok || !data || !data.ok) {
      showError((data && data.error) || 'upstream');
      return;
    }

    if (FREE_LIMIT_ON && !isSubscriber()) markFreeUsed();
    showResults(data.evaluation, data.truncated, FREE_LIMIT_ON && !isSubscriber());
  } catch (e) {
    showError('network');
  }
}

function showResults(r, truncated, showPaywallCard) {
  const score = Math.min(100, Math.max(0, parseInt(r.score, 10) || 0));
  const tier  = ['high', 'medium', 'low'].includes(r.tier)
    ? r.tier
    : score >= 70 ? 'high' : score >= 40 ? 'medium' : 'low';

  const momentsHTML = (r.trace_moments || []).map(m =>
    '<div class="trace-moment">' +
      '<div class="trace-moment-label">' + esc(m.label) + '</div>' +
      '<div class="trace-moment-text">' + esc(m.text) + '</div>' +
    '</div>'
  ).join('');

  document.getElementById('results-inner').innerHTML =
    (truncated
      ? '<div class="notice">This log exceeded the length limit and was evaluated on its first 40,000 characters.</div>'
      : '') +
    '<p class="results-eyebrow">Evaluation Complete</p>' +
    '<div class="score-block">' +
      '<div class="score-number ' + tier + '">' + score + '</div>' +
      '<div class="score-bar-track">' +
        '<div class="score-bar-fill ' + tier + '" id="score-bar" style="width:0%"></div>' +
      '</div>' +
      '<div class="score-tier ' + tier + '">' + esc(r.tier_label) + '</div>' +
    '</div>' +
    '<hr class="section-rule">' +
    '<div class="result-section">' +
      '<span class="section-label">The Reading</span>' +
      '<p class="rationale-text">' + esc(r.rationale) + '</p>' +
    '</div>' +
    (momentsHTML
      ? '<hr class="section-rule">' +
        '<div class="result-section">' +
          '<span class="section-label">Trace Moments</span>' +
          '<div class="trace-moments">' + momentsHTML + '</div>' +
        '</div>'
      : '') +
    (r.framework_note
      ? '<div class="framework-note">' +
          '<span class="section-label">Framework Note</span>' +
          '<p class="framework-note-text">' + esc(r.framework_note) + '</p>' +
        '</div>'
      : '') +
    (showPaywallCard
      ? '<div class="paywall-card">' +
          '<div class="paywall-inner">' +
            '<p class="paywall-eyebrow">Your free evaluation is complete.</p>' +
            '<h2 class="paywall-title">Continue with The Trace.</h2>' +
            '<p class="paywall-body">20 evaluations per month. Cancel anytime.</p>' +
            '<a href="/api/checkout" class="btn-subscribe">Subscribe · $5.99 / month</a>' +
          '</div>' +
        '</div>'
      : '<button class="btn-reset" onclick="resetEval()">Evaluate Another</button>');

  document.getElementById('loading-space').classList.remove('active');
  document.getElementById('results-space').classList.add('active');
  document.getElementById('btn-evaluate').disabled = false;

  setTimeout(function () {
    const bar = document.getElementById('score-bar');
    if (bar) bar.style.width = score + '%';
  }, 300);
}

function showPaywall() {
  document.getElementById('brand-space').classList.add('hidden');
  document.querySelector('.input-dock').classList.add('hidden');
  document.getElementById('results-inner').innerHTML =
    '<div class="paywall-card paywall-card--standalone">' +
      '<div class="paywall-inner">' +
        '<p class="paywall-eyebrow">Free evaluation used.</p>' +
        '<h2 class="paywall-title">Continue with The Trace.</h2>' +
        '<p class="paywall-body">20 evaluations per month. Cancel anytime.</p>' +
        '<a href="/api/checkout" class="btn-subscribe">Subscribe · $5.99 / month</a>' +
      '</div>' +
    '</div>';
  document.getElementById('results-space').classList.add('active');
}

function resetEval() {
  document.getElementById('results-space').classList.remove('active');
