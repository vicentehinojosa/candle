<script>
// ═══════════════════════════════════════
// ASTRONOMICAL ENGINE — Jean Meeus
// ═══════════════════════════════════════
const toRad=d=>d*Math.PI/180, toDeg=r=>r*180/Math.PI, norm=d=>((d%360)+360)%360;

function julianDay(year,month,day,hourUT){
  let y=year,m=month;
  if(m<=2){y--;m+=12;}
  const A=Math.floor(y/100),B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+day+B-1524.5+hourUT/24;
}
function sunLongitude(T){
  const L0=norm(280.46646+36000.76983*T);
  const M=norm(357.52911+35999.05029*T-0.0001537*T*T);
  const C=(1.914602-0.004817*T)*Math.sin(toRad(M))+(0.019993-0.000101*T)*Math.sin(toRad(2*M))+0.000289*Math.sin(toRad(3*M));
  return norm(L0+C);
}
function moonLongitude(T){
  const L=218.3165+481267.8813*T, M=norm(134.9634+477198.8676*T);
  const Ms=norm(357.5291+35999.0503*T), F=norm(93.2721+483202.0175*T), D=norm(297.8502+445267.1115*T);
  const dL=6893*Math.sin(toRad(M))+72*Math.sin(toRad(2*M))+1274*Math.sin(toRad(2*D-M))+658*Math.sin(toRad(2*D))
    -186*Math.sin(toRad(Ms))-214*Math.sin(toRad(2*F))+192*Math.sin(toRad(2*D+M))+148*Math.sin(toRad(2*D-Ms))-38*Math.sin(toRad(2*D-2*M));
  return norm(L+dL/3600);
}
const HELIO={
  Mercury:{L0:252.2509,L1:149472.6746,r:0.387},Venus:{L0:181.9798,L1:58517.8157,r:0.723},
  Mars:{L0:355.4330,L1:19140.3023,r:1.524},Jupiter:{L0:34.3515,L1:3034.9056,r:5.203},
  Saturn:{L0:50.0774,L1:1222.1138,r:9.537},Uranus:{L0:314.0550,L1:428.4668,r:19.19},
  Neptune:{L0:304.3487,L1:218.4862,r:30.07},Pluto:{L0:238.9508,L1:145.2008,r:39.48},
};
function planetGeoLon(name,T,sunLon){
  const el=HELIO[name]; const h=norm(el.L0+el.L1*T);
  if(name==='Mercury'||name==='Venus'){
    const earthLon=norm(sunLon+180);
    const xP=el.r*Math.cos(toRad(h)),yP=el.r*Math.sin(toRad(h));
    const xE=Math.cos(toRad(earthLon)),yE=Math.sin(toRad(earthLon));
    return norm(toDeg(Math.atan2(yP-yE,xP-xE)));
  }
  return h;
}
function calcAngles(jd,lat,lon){
  const JD0=Math.floor(jd-0.5)+0.5, T0=(JD0-2451545.0)/36525;
  const G0=norm(100.4606184+36000.77004*T0+0.000387933*T0*T0);
  const GMST=norm(G0+360.98564724*(jd-JD0)), RAMC=norm(GMST+lon);
  const T=(jd-2451545.0)/36525, eps=23.4392911-0.013004167*T;
  const ASC=norm(toDeg(Math.atan2(Math.cos(toRad(RAMC)),-Math.sin(toRad(RAMC))*Math.cos(toRad(eps))-Math.tan(toRad(lat))*Math.sin(toRad(eps)))));
  const MC=norm(toDeg(Math.atan2(Math.sin(toRad(RAMC)),Math.cos(toRad(RAMC))*Math.cos(toRad(eps)))));
  return {ASC,MC};
}
function calculateChart({year,month,day,hourUT,lat,lon}){
  const jd=julianDay(year,month,day,hourUT), T=(jd-2451545.0)/36525;
  const sun=sunLongitude(T), moon=moonLongitude(T), {ASC,MC}=calcAngles(jd,lat,lon);
  const positions={Sun:sun,Moon:moon,ASC,MC};
  for(const name of ['Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto'])
    positions[name]=planetGeoLon(name,T,sun);
  return positions;
}

// SIGN DATA

const SIGNS=['Aries','Taurus','Gemini','Cancer','Leo','Virgo','Libra','Scorpio','Sagittarius','Capricorn','Aquarius','Pisces'];
const GLYPHS=['♈','♉','♊','♋','♌','♍','♎','♏','♐','♑','♒','♓'];
const ELEMENTS=['Fire','Earth','Air','Water','Fire','Earth','Air','Water','Fire','Earth','Air','Water'];
const SIGN_COLORS=['#c0392b','#8B6914','#2980b9','#1a5276','#c0392b','#8B6914','#2980b9','#1a5276','#c0392b','#8B6914','#2980b9','#1a5276'];

function signOf(lon){
  const i=Math.floor(((lon%360)+360)%360/30), d=lon-i*30;
  return {name:SIGNS[i],glyph:GLYPHS[i],index:i,element:ELEMENTS[i],deg:Math.floor(d),min:Math.floor((d%1)*60)};
}

const SYMBOLS={Sun:'☉',Moon:'☽',Mercury:'☿',Venus:'♀',Mars:'♂',Jupiter:'♃',Saturn:'♄',Uranus:'♅',Neptune:'♆',Pluto:'♇',ASC:'⊕',MC:'↑'};

function findStelliums(positions){
  const counts={};
  for(const name of ['Sun','Moon','Mercury','Venus','Mars','Jupiter','Saturn','Uranus','Neptune','Pluto','ASC']){
    const s=signOf(positions[name]).name;
    counts[s]=(counts[s]||[]); counts[s].push(name);
  }
  return Object.entries(counts).filter(([,b])=>b.length>=3);
}

  if(formData.manualCoords){

    if(parts.length===2&&!isNaN(parts[0])&&!isNaN(parts[1])){
      castWithCoords(parts[0],parts[1],formData.city);
      return;
    } else {
      errorArea.innerHTML='<div class="form-error">Coordinates must be: lat, lon (e.g. 39.64, -104.98)</div>';
      return;
    }
  }

  document.getElementById('btn-resolve').disabled=true;
  document.getElementById('btn-resolve').textContent='Resolving coordinates…';

  try {
    const res=await fetch('/api/natal',{
      method:'POST',headers: { 'Content-Type': 'application/json' },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:300,
        messages:[{role:'user',content:`You are a geocoding service. Return ONLY a raw JSON object with no markdown, no backticks, no explanation — just the JSON object starting with {.\n\nBirth location: "${formData.city}"\n\nResolve to coordinates. If ambiguous, use the most populated match.\n\nRequired format:\n{"lat": 39.6483, "lon": -104.9878, "resolved": "Englewood, Colorado, USA"}`}]
      })
    });
    const data=await res.json();
    const raw=data.content?.map(b=>b.text||'').join('').trim();
    const match=raw.match(/\{[\s\S]*\}/);
    if(!match) throw new Error('No JSON');
    const geo=JSON.parse(match[0]);
    if(!geo.lat||!geo.lon) throw new Error('Invalid');
    castWithCoords(geo.lat,geo.lon,geo.resolved||formData.city);
  } catch(e){
    formData.showManual=true;
    errorArea.innerHTML='<div class="form-error">City not found. Enter coordinates manually below.</div>';
    document.getElementById('manual-area').style.display='block';
    document.getElementById('btn-resolve').disabled=false;
    document.getElementById('btn-resolve').textContent='Cast Chart ✦';
  }
}

function castWithCoords(lat,lon,cityName){
  const[yr,mo,dy]=formData.date.split('-').map(Number);
  const[hr,mn]=formData.time.split(':').map(Number);
  const utcOff=parseFloat(formData.utcOffset);
  const hourUT=hr+mn/60-utcOff;
  birthData={year:yr,month:mo,day:dy,hourUT,lat,lon,name:formData.name,city:cityName,localTime:formData.time,utcOffset:formData.utcOffset};
  chart=calculateChart(birthData);
  currentTab='wheel'; reading=''; loadingReading=false;
  renderChart();

  // Mark visited
  try {
    const d=localStorage.getItem('candle_temple');
    if(d){ const state=JSON.parse(d); if(!state.visited.includes('natal')) state.visited.push('natal'); localStorage.setItem('candle_temple',JSON.stringify(state)); }
  } catch(e){}
}

function renderChart(){
  const sunS=signOf(chart.Sun),moonS=signOf(chart.Moon),ascS=signOf(chart.ASC);
  const[yr,mo,dy]=formData.date.split('-').map(Number);
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr=`${dy} ${months[mo-1]} ${yr}`;

  app.innerHTML = `
    <div class="chart-header">
      <div class="eyebrow">Nativity</div>
      <h1 class="chart-name">${birthData.name}</h1>
      <p class="chart-details">${dateStr} · ${formData.time} · ${birthData.city}</p>
      <div class="chart-badges">
        <span class="chart-badge">${ascS.name} Rising</span>
        <span class="chart-badge">Sun in ${sunS.name}</span>
        <span class="chart-badge">Moon in ${moonS.name}</span>
      </div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${currentTab==='wheel'?'active':''}" onclick="setTab('wheel')">Wheel</button>
      <button class="tab-btn ${currentTab==='placements'?'active':''}" onclick="setTab('placements')">Placements</button>
      <button class="tab-btn ${currentTab==='reading'?'active':''}" onclick="fetchReading()">Full Reading ✦</button>
      <button class="tab-btn-new" onclick="resetChart()">New ↩</button>
    </div>
    <div id="tab-content"></div>
  `;

  renderTab();
}

function setTab(t){ currentTab=t; renderChart(); }
function resetChart(){ chart=null; birthData=null; reading=''; render(); }

function renderTab(){
  const el=document.getElementById('tab-content');
  if(currentTab==='wheel') renderWheel(el);
  else if(currentTab==='placements') renderPlacements(el);
  else if(currentTab==='reading') renderReadingTab(el);
}

function renderWheel(el){
  // Build SVG
  const cx=210,cy=210,R=195,r2=160,r3=120;
  const toAngle=lon=>toRad(180-norm(lon-chart.ASC));

  let svg=`<svg width="420" height="420" viewBox="0 0 420 420" style="max-width:100%;">
    <defs><radialGradient id="bgGrad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#111130"/><stop offset="100%" stop-color="#050510"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
    <circle cx="${cx}" cy="${cy}" r="${R+5}" fill="url(#bgGrad)"/>
    <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#C9A84C" stroke-width="1"/>
    <circle cx="${cx}" cy="${cy}" r="${r2}" fill="none" stroke="#C9A84C" stroke-width="0.6"/>
    <circle cx="${cx}" cy="${cy}" r="${r3}" fill="none" stroke="#C9A84C" stroke-width="0.4" stroke-opacity="0.5"/>
    <circle cx="${cx}" cy="${cy}" r="30" fill="none" stroke="#C9A84C" stroke-width="0.3" stroke-opacity="0.4"/>`;

  // Sectors
  for(let i=0;i<12;i++){
    const a1=toAngle(i*30),a2=toAngle((i+1)*30),mid=toAngle(i*30+15);
    const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const x3=cx+r2*Math.cos(a2),y3=cy+r2*Math.sin(a2),x4=cx+r2*Math.cos(a1),y4=cy+r2*Math.sin(a1);
    const tx=cx+(R-17)*Math.cos(mid),ty=cy+(R-17)*Math.sin(mid);
    svg+=`<path d="M${x1},${y1} A${R},${R} 0 0,0 ${x2},${y2} L${x3},${y3} A${r2},${r2} 0 0,1 ${x4},${y4} Z" fill="${SIGN_COLORS[i]}" fill-opacity="0.18" stroke="#C9A84C" stroke-width="0.7"/>`;
    svg+=`<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#C9A84C" font-family="serif">${GLYPHS[i]}</text>`;
  }

  // Ticks
  for(let i=0;i<72;i++){
    const a=toAngle(i*5),major=i%6===0;
    svg+=`<line x1="${cx+r2*Math.cos(a)}" y1="${cy+r2*Math.sin(a)}" x2="${cx+(r2-(major?12:5))*Math.cos(a)}" y2="${cy+(r2-(major?12:5))*Math.sin(a)}" stroke="#C9A84C" stroke-width="${major?0.8:0.3}" stroke-opacity="0.6"/>`;
  }

  // Axes
  const ascA=toAngle(chart.ASC),dcA=toAngle(norm(chart.ASC+180)),mcA=toAngle(chart.MC),icA=toAngle(norm(chart.MC+180));
  svg+=`<line x1="${cx+r3*Math.cos(ascA)}" y1="${cy+r3*Math.sin(ascA)}" x2="${cx+r3*Math.cos(dcA)}" y2="${cy+r3*Math.sin(dcA)}" stroke="rgba(201,168,76,0.4)" stroke-width="0.8"/>`;
  svg+=`<line x1="${cx+r3*Math.cos(mcA)}" y1="${cy+r3*Math.sin(mcA)}" x2="${cx+r3*Math.cos(icA)}" y2="${cy+r3*Math.sin(icA)}" stroke="rgba(201,168,76,0.4)" stroke-width="0.8"/>`;

  // Angle markers
  [{lon:chart.ASC,label:'AC'},{lon:norm(chart.ASC+180),label:'DC'},{lon:chart.MC,label:'MC'},{lon:norm(chart.MC+180),label:'IC'}].forEach(({lon,label})=>{
    const a=toAngle(lon),rm=r2-7;
    svg+=`<text x="${cx+rm*Math.cos(a)}" y="${cy+rm*Math.sin(a)}" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="#C9A84C" font-family="sans-serif" font-weight="600">${label}</text>`;
  });

  // Planets
  DISPLAY_ORDER.filter(n=>n!=='ASC'&&n!=='MC').forEach(name=>{
    const lon=chart[name],angle=toAngle(lon),rp=r3-10;
    const x=cx+rp*Math.cos(angle),y=cy+rp*Math.sin(angle);
    const lx=cx+(r3-32)*Math.cos(angle),ly=cy+(r3-32)*Math.sin(angle);
    const s=signOf(lon);
    svg+=`<line x1="${cx+r2*Math.cos(angle)}" y1="${cy+r2*Math.sin(angle)}" x2="${cx+(r3+5)*Math.cos(angle)}" y2="${cy+(r3+5)*Math.sin(angle)}" stroke="${P_COLORS[name]}" stroke-width="0.5" stroke-opacity="0.4"/>`;
    svg+=`<circle cx="${x}" cy="${y}" r="11" fill="#0a0a18" stroke="${P_COLORS[name]}" stroke-width="1.2"/>`;
    svg+=`<text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="${P_COLORS[name]}" font-family="serif">${SYMBOLS[name]}</text>`;
    svg+=`<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="7" fill="${P_COLORS[name]}" opacity="0.7">${s.deg}°${GLYPHS[s.index]}</text>`;
  });

  svg+=`<circle cx="${cx}" cy="${cy}" r="4" fill="#C9A84C" filter="url(#glow)"/>`;
  svg+=`<circle cx="${cx}" cy="${cy}" r="1.5" fill="#fff"/>`;
  svg+=`</svg>`;

  const ascSig=signOf(chart.ASC), mcSig=signOf(chart.MC);
  el.innerHTML=`
    <div class="wheel-wrap">
      ${svg}
      <div class="wheel-footer">
        <div style="text-align:center"><span>ASC</span> ${ascSig.deg}°${ascSig.min.toString().padStart(2,'0')}′ ${ascSig.glyph} ${ascSig.name}</div>
        <div style="text-align:center"><span>MC</span> ${mcSig.deg}°${mcSig.min.toString().padStart(2,'0')}′ ${mcSig.glyph} ${mcSig.name}</div>
      </div>
      <p class="footer-note">Tropical Zodiac · Placidus · UTC${parseFloat(formData.utcOffset)>=0?'+':''}${formData.utcOffset}</p>
    </div>
  `;
}

function renderPlacements(el){
  const stelliums=findStelliums(chart);
  let html='<div class="placements-grid">';
  DISPLAY_ORDER.forEach(name=>{
    const s=signOf(chart[name]);
    html+=`<div class="placement-cell">
      <span class="placement-symbol" style="color:${P_COLORS[name]}">${SYMBOLS[name]}</span>
      <div>
        <div class="placement-label">${name}</div>
        <div class="placement-value">${s.deg}°${s.min.toString().padStart(2,'0')}′ ${s.glyph} ${s.name}</div>
        <div class="placement-element">${s.element}</div>
      </div>
    </div>`;
  });
  html+='</div>';

  stelliums.forEach(([sign,bodies])=>{
    html+=`<div class="stellium-box"><div class="stellium-label">${sign} Stellium</div>
      <p class="stellium-text">${bodies.join(' · ')} — ${bodies.length} placements unified under one archetype.${bodies.length>=4?' This is rare.':''}</p></div>`;
  });

  el.innerHTML=html;
}

async function fetchReading(){
  currentTab='reading';
  renderChart();
  const el=document.getElementById('tab-content');

  if(reading){ el.innerHTML=`<div class="reading-text">${reading}</div>`; return; }

  el.innerHTML=`<div class="reading-loading"><div class="reading-loading-symbol">✦</div><div class="reading-loading-text">Reading the chart…</div></div>`;

  const placements=DISPLAY_ORDER.map(name=>{const s=signOf(chart[name]);return`${name}: ${s.deg}°${s.min.toString().padStart(2,'0')}' ${s.name}`;}).join('\n');
  const stelliums=findStelliums(chart);
  const stelliumNote=stelliums.length>0?`Notable stelliums: ${stelliums.map(([sign,bodies])=>`${bodies.join(', ')} in ${sign}`).join('; ')}.`:'No major stelliums.';
  const sunSign=signOf(chart.Sun).name,moonSign=signOf(chart.Moon).name,ascSign=signOf(chart.ASC).name,mcSign=signOf(chart.MC).name;

  try {
    const res=await fetch('/api/natal',{
      method:'POST',headers: { 'Content-Type': 'application/json' },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:1000,
        messages:[{role:'user',content:`You are a masterful, philosophically erudite astrologer. Provide a natal chart reading for ${birthData.name}, born ${formData.date} at ${birthData.localTime} local time in ${birthData.city}.

Calculated natal positions (Tropical, Placidus):
${placements}

Key signatures:
- Sun in ${sunSign}, Moon in ${moonSign}, ${ascSign} Rising
- MC in ${mcSign}
- ${stelliumNote}

Provide a reading of 450–550 words that:
1. Opens with the single most architecturally significant feature of this chart
2. Reads the Sun/Moon/Rising trinity
3. Interprets the MC and what it suggests about vocation and legacy
4. Identifies one significant tension in the chart
5. Speaks to the overall quality of this life's orientation — not predictions, but nature
6. Ends with one unflinching observation that a lesser reader would omit

Tone: erudite, unadorned. No bullet points. Flowing paragraphs. No flattery. Speak directly using "you."`}]
      })
    });
    const data=await res.json();
    reading=data.content?.map(b=>b.text||'').join('')||'Reading unavailable.';
  } catch(e){
    reading='The connection to the interpreter was lost. Please try again.';
  }

  el.innerHTML=`<div class="reading-text">${reading}</div>`;
}

// Init
render();
</script>
